services:
  frontend:
    image: roml04/dcs-frontend:1.0.0
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      NODE_ENV: production
      PORT: "3000"
      VITE_API_URL: /api
    depends_on:
      - backend
  backend:
    image: roml04/dcs-backend:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env.docker
    environment:
      APP_URL: ${APP_URL}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL}
      ONLYOFFICE_DOCS_INTERNAL_URL: ${ONLYOFFICE_DOCS_INTERNAL_URL}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - laravel_private:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    image: roml04/dcs-backend:1.0.0
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90
    env_file:
      - ./backend/.env.docker
    environment:
      APP_URL: ${APP_URL}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL}
      ONLYOFFICE_DOCS_INTERNAL_URL: ${ONLYOFFICE_DOCS_INTERNAL_URL}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - laravel_private:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice

volumes:
  mysql_data:
  laravel_private:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
